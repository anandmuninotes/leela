<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सार्थ लीळा चरित्र - स्मरण पाठ जुळवणी</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Marathi Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Mukta', sans-serif;
            background-color: #fffaf0; /* Very light warm background */
            background-image: radial-gradient(#ffedd5 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Hide number input arrows for clean UI */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { 
            -moz-appearance: textfield; 
        }

        /* Button transition classes */
        .section-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .section-btn.active {
            background-color: #ea580c; /* Tailwind orange-600 */
            color: white;
            border-color: #c2410c;
            box-shadow: 0 10px 15px -3px rgba(234, 88, 12, 0.3);
            transform: translateY(-2px);
        }
        
        .section-btn.inactive {
            background-color: white;
            color: #4b5563;
            border-color: #fdba74;
        }

        .section-btn.inactive:hover {
            background-color: #ffedd5;
            border-color: #ea580c;
        }
    </style>
</head>

            <div>

                <div class="grid grid-cols-2 gap-3 sm:grid-cols-4" id="section-tabs">
                    <button onclick="selectSection('purvardha')" id="btn-purvardha" class="section-btn active py-3 px-2 rounded-xl font-bold border-2 text-lg sm:text-base">पूर्वार्ध</button>
                    <button onclick="selectSection('uttarardha')" id="btn-uttarardha" class="section-btn inactive py-3 px-2 rounded-xl font-bold border-2 text-lg sm:text-base">उत्तरार्ध</button>
                    <button onclick="selectSection('agyat')" id="btn-agyat" class="section-btn inactive py-3 px-2 rounded-xl font-bold border-2 text-lg sm:text-base">अज्ञात लीळा</button>
                    <button onclick="selectSection('shrikrishna')" id="btn-shrikrishna" class="section-btn inactive py-3 px-2 rounded-xl font-bold border-2 text-lg sm:text-base">श्रीकृष्ण चरित्र</button>
                </div>
            </div>

            <div>
                <label for="leela-input" class="block text-xl font-bold mb-4 text-gray-700 flex items-center gap-2">
                    <span class="bg-orange-500 text-white w-8 h-8 rounded-full flex items-center justify-center text-lg shadow-sm">२</span>
                    लीळा क्रमांक टाका
                </label>
                <div class="relative">

                    <!-- Clear button -->

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="mt-8">
                <div id="result-container" class="bg-gradient-to-b from-orange-50 to-orange-100 rounded-3xl p-8 text-center border-2 border-orange-200 shadow-sm min-h-[200px] flex flex-col items-center justify-center transition-all duration-300 relative overflow-hidden">
                    
                    <!-- Decorative background pattern -->
                    <div class="absolute inset-0 opacity-10 pointer-events-none flex items-center justify-center text-[10rem]">
                        ...
                    </div>

                    <div class="relative z-10 w-full">

                        </div>

                        </p>
                    </div>
                </div>
            </div>

        // =========================================================================
        // JAVASCRIPT LOGIC

        let currentSection = 'purvardha';
        let database = {
            purvardha: {},
            uttarardha: {},
            agyat: {},
            shrikrishna: {}
        };

        // Initialize dictionaries when the page loads
        window.onload = function() {
            database.purvardha = parseTableData(rawPurvardha);
            database.uttarardha = parseTableData(rawUttarardha);
            database.agyat = parseStringData(rawAgyat);
            database.shrikrishna = parseStringData(rawShrikrishna);
            
            // Trigger a search on load just in case (will be empty)
            searchMapping();
        };

        // Function to parse the Markdown-like tables carefully
        function parseTableData(rawText) {
            const dict = {};
            const lines = rawText.trim().split('\n');
            for (let line of lines) {
                if (!line.includes('|')) continue;
                
                // Skip header lines to prevent garbage data
                if (line.includes('लीळा') || line.includes('स्मरण') || line.includes('कोलते') || line.includes('अनुक्रमांक')) continue;
                
                const cells = line.split('|').map(s => s.trim()).filter(s => s !== '');
                
                // Standard structure is pairs of Leela : Smaran
                for (let i = 0; i < cells.length; i += 2) {
                    const keyStr = cells[i];
                    const valStr = cells[i+1];
                    
                    if (keyStr !== undefined && valStr !== undefined && valStr !== '-') {
                        // Extract numeric key
                        const cleanKey = keyStr.replace(/[^\d]/g, '');
                        if (cleanKey && cleanKey !== '') {
                            dict[cleanKey] = valStr;
                        }
                    }
                }
            }
            return dict;
        }

        // Helper for simple pipe-separated key:value string mapping
        function parseStringData(str) {
            const dict = {};
            const pairs = str.split('|');
            for (let p of pairs) {
                const parts = p.split(':');
                if (parts.length === 2) {
                    dict[parts[0].trim()] = parts[1].trim();
                }
            }
            return dict;
        }

        // Change current section category
        function selectSection(sectionName) {
            currentSection = sectionName;
            
            // Update button styles
            const btns = document.querySelectorAll('.section-btn');
            btns.forEach(btn => {
                btn.classList.remove('active');
                btn.classList.add('inactive');
            });
            
            const activeBtn = document.getElementById(`btn-${sectionName}`);
            activeBtn.classList.remove('inactive');
            activeBtn.classList.add('active');
            
            // Re-run search in the new section
            searchMapping();
        }

        // Helper to convert typed Marathi numerals (०-९) to English digits for logic
        function convertMarathiToEnglishNumbers(str) {
            const marathiNumbers = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];
            let result = '';
            for (let char of str) {
                const index = marathiNumbers.indexOf(char);
                if (index !== -1) {
                    result += index; // Map to 0-9
                } else {
                    result += char; // Keep English numbers intact
                }
            }
            return result.replace(/[^\d]/g, ''); // return clean digits only
        }

        // The main search function triggered on typing
        function searchMapping() {
            const inputField = document.getElementById('leela-input');
            const clearBtn = document.getElementById('clear-btn');
            const rawInput = inputField.value;
            
            // Toggle clear button visibility
            if(rawInput.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            const cleanNumber = convertMarathiToEnglishNumbers(rawInput.trim());
            const resultValue = document.getElementById('result-value');
            const resultMsg = document.getElementById('result-message');
            const resultContainer = document.getElementById('result-container');

            // If empty
            if (!cleanNumber) {
                resultValue.innerText = '-';
                resultMsg.classList.add('hidden');
                resultContainer.classList.remove('bg-orange-100');
                resultContainer.classList.add('bg-orange-50');
                return;
            }

            const activeDict = database[currentSection];
            
            // If match is found
            if (activeDict && activeDict[cleanNumber]) {
                resultValue.innerText = activeDict[cleanNumber];
                resultMsg.classList.add('hidden');
                // Subtle highlight animation
                resultContainer.classList.remove('bg-orange-50');
                resultContainer.classList.add('bg-orange-100');
                resultValue.classList.remove('text-red-500');
                resultValue.classList.add('text-orange-600');
            } else {
                // No match
                resultValue.innerText = '-';
                resultMsg.classList.remove('hidden');
                resultContainer.classList.remove('bg-orange-100');
                resultContainer.classList.add('bg-orange-50');
            }
        }
        
        // Function to quickly clear input
        function clearInput() {
            const inputField = document.getElementById('leela-input');
            inputField.value = '';
            inputField.focus();
            searchMapping();
        }
